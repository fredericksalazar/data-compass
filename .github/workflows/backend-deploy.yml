name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "api/**"

env:
  IMAGE_URL: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID
    }}/datacompass-api/app-image:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker authentication
        # Se añade la región específica para que el Push no sea rechazado
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build and push Docker image
        run: |
          docker build -t $IMAGE_URL -f api/Dockerfile api/
          docker push $IMAGE_URL

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy datacompass-api \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --image $IMAGE_URL \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080
