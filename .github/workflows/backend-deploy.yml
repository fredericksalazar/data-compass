name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'api/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker authentication
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |
          cd api
          docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/datacompass-api:${{ github.sha }} .
          docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/datacompass-api:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy datacompass-api \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/datacompass-api:${{ github.sha }} \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars FIREBASE_CREDENTIALS_PATH=firebase-credentials.json